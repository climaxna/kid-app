<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎨 포켓몬 색칠판</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-bottom: 3px solid #e94560;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#header h1 { color: #FFD700; font-size: 18px; font-weight: 900; }
#sound-indicator { display: flex; align-items: center; gap: 6px; color: #4ade80; font-size: 13px; }
#sound-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }

#pokemon-bar {
  background: #16213e;
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  overflow-x: auto;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
#pokemon-bar::-webkit-scrollbar { display: none; }
.pokemon-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; padding: 6px 12px;
  border-radius: 10px; border: 2px solid transparent;
  color: #888; font-size: 11px; font-weight: 700;
  background: #0f3460; flex-shrink: 0;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.pokemon-btn.active { border-color: #FFD700; color: #FFD700; background: #1a3a5c; }
.pokemon-btn .emoji { font-size: 24px; line-height: 1; }

#main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

#palette {
  background: #16213e;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 5px; padding: 8px 7px;
  border-right: 2px solid #0f3460;
  flex-shrink: 0;
  overflow-y: auto;
}
#palette::-webkit-scrollbar { display: none; }
.color-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: all 0.12s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.color-btn.active { border-color: #fff; transform: scale(1.2); }
.eraser-btn { border-color: #444 !important; font-size: 18px; color: #888; display: flex; align-items: center; justify-content: center; }
.eraser-btn.active { border-color: #FFD700 !important; }

#clear-btn {
  width: 42px; height: 42px; border-radius: 10px;
  background: #e94560; border: none; cursor: pointer;
  font-size: 20px; margin-top: 4px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

#canvas-area {
  flex: 1; position: relative;
  background: white;
  overflow: hidden;
}
#draw-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none;
  cursor: crosshair;
}

#loading-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: white; font-size: 16px; color: #aaa;
  z-index: 10;
}
#loading-overlay.hidden { display: none; }

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: white;
  padding: 8px 20px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  white-space: nowrap;
}
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center; z-index: 200;
}
#modal-overlay.show { display: flex; }
#modal {
  background: #16213e; border: 2px solid #e94560;
  border-radius: 16px; padding: 28px 24px; text-align: center; color: white; max-width: 280px;
}
#modal p { font-size: 17px; margin-bottom: 22px; line-height: 1.5; }
#modal-buttons { display: flex; gap: 12px; justify-content: center; }
.modal-btn { padding: 11px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
#modal-cancel { background: #3a3a4a; color: white; }
#modal-confirm { background: #e94560; color: white; }
</style>
</head>
<body>

<div id="header">
  <h1>🎨 포켓몬 색칠판</h1>
  <div id="sound-indicator">
    <div id="sound-dot"></div>
    <span>소리 켜짐</span>
  </div>
</div>

<div id="pokemon-bar">
  <button class="pokemon-btn active" data-id="25" data-name="피카츄"><span class="emoji">⚡</span>피카츄</button>
  <button class="pokemon-btn" data-id="4" data-name="파이리"><span class="emoji">🔥</span>파이리</button>
  <button class="pokemon-btn" data-id="7" data-name="꼬부기"><span class="emoji">💧</span>꼬부기</button>
  <button class="pokemon-btn" data-id="1" data-name="이상해씨"><span class="emoji">🌿</span>이상해씨</button>
  <button class="pokemon-btn" data-id="133" data-name="이브이"><span class="emoji">🤎</span>이브이</button>
  <button class="pokemon-btn" data-id="39" data-name="푸린"><span class="emoji">🩷</span>푸린</button>
  <button class="pokemon-btn" data-id="54" data-name="고라파덕"><span class="emoji">💛</span>고라파덕</button>
  <button class="pokemon-btn" data-id="143" data-name="잠만보"><span class="emoji">🐻</span>잠만보</button>
  <button class="pokemon-btn" data-id="94" data-name="겐가"><span class="emoji">👻</span>겐가</button>
  <button class="pokemon-btn" data-id="150" data-name="뮤츠"><span class="emoji">💜</span>뮤츠</button>
</div>

<div id="main">
  <div id="palette">
    <button class="color-btn active" data-color="#FF3B30" style="background:#FF3B30"></button>
    <button class="color-btn" data-color="#FF9500" style="background:#FF9500"></button>
    <button class="color-btn" data-color="#FFD700" style="background:#FFD700"></button>
    <button class="color-btn" data-color="#34C759" style="background:#34C759"></button>
    <button class="color-btn" data-color="#007AFF" style="background:#007AFF"></button>
    <button class="color-btn" data-color="#AF52DE" style="background:#AF52DE"></button>
    <button class="color-btn" data-color="#FF69B4" style="background:#FF69B4"></button>
    <button class="color-btn" data-color="#8B4513" style="background:#8B4513"></button>
    <button class="color-btn" data-color="#1C1C1E" style="background:#1C1C1E"></button>
    <button class="color-btn eraser-btn" data-color="eraser" style="background:white">✕</button>
    <button id="clear-btn">🗑</button>
  </div>

  <div id="canvas-area">
    <div id="loading-overlay">불러오는 중... 🎨</div>
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<div id="toast"></div>
<div id="modal-overlay">
  <div id="modal">
    <p>그림을 모두 지울까요?</p>
    <div id="modal-buttons">
      <button class="modal-btn" id="modal-cancel">취소</button>
      <button class="modal-btn" id="modal-confirm">지우기</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('draw-canvas');
const c = canvas.getContext('2d', { willReadFrequently: true });
const dpr = window.devicePixelRatio || 1;

// Hidden canvas for boundary detection (outline pixels)
const boundaryCanvas = document.createElement('canvas');
const bc = boundaryCanvas.getContext('2d', { willReadFrequently: true });

let currentColor = '#FF3B30';
let currentPokemonImg = null;
let audioCtx = null;
let activeOsc = null, activeGain = null;

// ── Resize ────────────────────────────────────────────────────────────────────
function getCanvasSize() {
  const area = document.getElementById('canvas-area');
  const r = area.getBoundingClientRect();
  return { w: r.width, h: r.height };
}

function resize() {
  const { w, h } = getCanvasSize();
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  c.scale(dpr, dpr);
  boundaryCanvas.width = w;
  boundaryCanvas.height = h;
  if (currentPokemonImg) redraw(currentPokemonImg);
}
window.addEventListener('resize', resize);

// ── Draw outline onto canvas and boundary canvas ───────────────────────────────
function computeImgRect(img, cw, ch) {
  const pad = 24;
  const availW = cw - pad * 2;
  const availH = ch - pad * 2;
  const scale = Math.min(availW / img.width, availH / img.height);
  const dw = img.width * scale;
  const dh = img.height * scale;
  const dx = (cw - dw) / 2;
  const dy = (ch - dh) / 2;
  return { dx, dy, dw, dh };
}

function redraw(img) {
  const { w, h } = getCanvasSize();

  // 1) White background
  c.clearRect(0, 0, w, h);
  c.fillStyle = 'white';
  c.fillRect(0, 0, w, h);

  const { dx, dy, dw, dh } = computeImgRect(img, w, h);

  // 2) Build boundary canvas: outline pixels = black, rest = white
  bc.clearRect(0, 0, w, h);
  bc.fillStyle = 'white';
  bc.fillRect(0, 0, w, h);
  bc.drawImage(img, dx, dy, dw, dh);

  const imgData = bc.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    // Dark + opaque pixels = outline boundary
    const isBoundary = a > 80 && gray < 160;
    data[i]     = isBoundary ? 0 : 255;
    data[i + 1] = isBoundary ? 0 : 255;
    data[i + 2] = isBoundary ? 0 : 255;
    data[i + 3] = 255;
  }
  bc.putImageData(imgData, 0, 0);

  // 3) Draw outline on main canvas (dark lines only)
  c.drawImage(boundaryCanvas, 0, 0);
}

// ── Pokemon loader ─────────────────────────────────────────────────────────────
function loadPokemon(id, name) {
  document.getElementById('loading-overlay').classList.remove('hidden');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    currentPokemonImg = img;
    resize();
    document.getElementById('loading-overlay').classList.add('hidden');
    showToast(name + ' 색칠해 보세요! 🎨');
  };
  img.onerror = () => {
    document.getElementById('loading-overlay').textContent = '이미지를 불러오지 못했어요 😢';
  };
  img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
}

// ── Flood fill ────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}

function colorMatch(data, idx, r, g, b, a) {
  return data[idx]===r && data[idx+1]===g && data[idx+2]===b && data[idx+3]===a;
}

function floodFill(startX, startY, fillHex) {
  const { w, h } = getCanvasSize();
  const iw = Math.round(w), ih = Math.round(h);

  // Get boundary data
  const bData = bc.getImageData(0, 0, iw, ih).data;

  // Check if starting pixel is a boundary
  const si = (startY * iw + startX) * 4;
  if (bData[si] < 128) return; // clicked on outline boundary, skip

  // Work on main canvas
  const imageData = c.getImageData(0, 0, iw, ih);
  const data = imageData.data;

  const idx = (y, x) => (y * iw + x) * 4;
  const ti = idx(startY, startX);
  const targetR = data[ti], targetG = data[ti+1], targetB = data[ti+2], targetA = data[ti+3];

  const [fillR, fillG, fillB] = hexToRgb(fillHex);
  if (targetR===fillR && targetG===fillG && targetB===fillB && targetA===255) return;

  const visited = new Uint8Array(iw * ih);
  const queue = [startX + startY * iw];
  visited[startX + startY * iw] = 1;

  while (queue.length > 0) {
    const pos = queue.pop();
    const x = pos % iw;
    const y = (pos / iw) | 0;
    const i = pos * 4;

    data[i]   = fillR;
    data[i+1] = fillG;
    data[i+2] = fillB;
    data[i+3] = 255;

    const neighbors = [
      x-1 >= 0   ? pos-1   : -1,
      x+1 < iw   ? pos+1   : -1,
      y-1 >= 0   ? pos-iw  : -1,
      y+1 < ih   ? pos+iw  : -1,
    ];

    for (const n of neighbors) {
      if (n < 0 || visited[n]) continue;
      const ni = n * 4;
      // Stop at boundary
      if (bData[ni] < 128) continue;
      // Only fill pixels matching the original color
      if (!colorMatch(data, ni, targetR, targetG, targetB, targetA)) continue;
      visited[n] = 1;
      queue.push(n);
    }
  }

  c.putImageData(imageData, 0, 0);

  // Re-draw outline on top
  c.drawImage(boundaryCanvas, 0, 0);
}

// ── Eraser: paint white in a circle ──────────────────────────────────────────
function erase(x, y) {
  c.save();
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = 'white';
  c.beginPath();
  c.arc(x, y, 18, 0, Math.PI * 2);
  c.fill();
  c.restore();
  // Re-draw outline
  c.drawImage(boundaryCanvas, 0, 0);
}

// ── Tap handler ───────────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: Math.round((src.clientX - r.left)),
    y: Math.round((src.clientY - r.top))
  };
}

canvas.addEventListener('click', (e) => {
  if (!currentPokemonImg) return;
  const { x, y } = getPos(e);
  if (currentColor === 'eraser') {
    erase(x, y);
  } else {
    floodFill(x, y, currentColor);
    playSound(currentColor);
  }
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!currentPokemonImg) return;
  const r = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  const x = Math.round(t.clientX - r.left);
  const y = Math.round(t.clientY - r.top);
  if (currentColor === 'eraser') {
    erase(x, y);
  } else {
    floodFill(x, y, currentColor);
    playSound(currentColor);
  }
}, { passive: false });

// ── Color palette ─────────────────────────────────────────────────────────────
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
  });
});

// ── Pokemon selector ──────────────────────────────────────────────────────────
document.querySelectorAll('.pokemon-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pokemon-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadPokemon(btn.dataset.id, btn.dataset.name);
  });
});

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.add('show');
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
});
document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  if (currentPokemonImg) redraw(currentPokemonImg);
  showToast('그림을 깨끗하게 지웠어요!');
});

// ── Audio ─────────────────────────────────────────────────────────────────────
const SOUNDS = {
  '#FF3B30': 'drum', '#FF9500': 'maracas', '#FFD700': 'xylophone',
  '#34C759': 'piano-high', '#007AFF': 'piano-low', '#AF52DE': 'violin',
  '#FF69B4': 'xylophone', '#8B4513': 'bass', '#1C1C1E': 'bass'
};

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(color) {
  if (color === 'eraser') return;
  const type = SOUNDS[color];
  if (!type) return;
  const ac = getAudioCtx();

  if (type === 'drum') {
    const len = ac.sampleRate * 0.15;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3);
    const src = ac.createBufferSource(); src.buffer = buf;
    const g = ac.createGain(); g.gain.value = 0.5;
    src.connect(g).connect(ac.destination); src.start();
    const o = ac.createOscillator(), g2 = ac.createGain();
    o.frequency.setValueAtTime(110, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.18);
    g2.gain.setValueAtTime(0.9, ac.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
    o.connect(g2).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.22);
  } else if (type === 'maracas') {
    const len = ac.sampleRate * 0.1;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.5);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 4000; f.Q.value = 0.5;
    const g = ac.createGain(); g.gain.value = 0.7;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  } else if (type === 'xylophone') {
    const notes = [523, 659, 784, 1047];
    const freq = notes[Math.floor(Math.random() * notes.length)];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.6, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.5);
  } else if (type === 'piano-high') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 523;
    g.gain.setValueAtTime(0.5, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.8);
  } else if (type === 'piano-low') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 262;
    g.gain.setValueAtTime(0.5, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.8);
  } else if (type === 'violin') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 440; o.detune.value = 8;
    g.gain.setValueAtTime(0.3, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.6);
  } else if (type === 'bass') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = 110;
    g.gain.setValueAtTime(0.5, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.5);
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = '0', 2200);
}

// ── Init ──────────────────────────────────────────────────────────────────────
resize();
loadPokemon('25', '피카츄');
</script>
</body>
</html>
