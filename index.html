<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎨 포켓몬 소리 색칠판</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-bottom: 3px solid #e94560;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#header h1 { color: #FFD700; font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
#sound-indicator { display: flex; align-items: center; gap: 6px; color: #4ade80; font-size: 13px; }
#sound-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }

#pokemon-bar {
  background: #16213e;
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  overflow-x: auto;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
#pokemon-bar::-webkit-scrollbar { display: none; }
.pokemon-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; padding: 6px 12px;
  border-radius: 10px; border: 2px solid transparent;
  color: #888; font-size: 11px; font-weight: 700;
  background: #0f3460; flex-shrink: 0;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.pokemon-btn.active { border-color: #FFD700; color: #FFD700; background: #1a3a5c; }
.pokemon-btn .emoji { font-size: 24px; line-height: 1; }

#main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

#palette {
  background: #16213e;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 5px; padding: 8px 7px;
  border-right: 2px solid #0f3460;
  flex-shrink: 0;
  overflow-y: auto;
}
#palette::-webkit-scrollbar { display: none; }
.color-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  transition: all 0.12s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.color-btn.active { border-color: #fff; transform: scale(1.2); }
.eraser-btn { border-color: #444 !important; }
.eraser-btn.active { border-color: #FFD700 !important; }

#brush-size-group { display: flex; flex-direction: column; gap: 4px; align-items: center; margin-top: 2px; }
.size-btn {
  background: #0f3460; border: 2px solid transparent;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.size-btn.active { border-color: #FFD700; background: #1a3a5c; }
.size-btn.small { width: 36px; height: 36px; }
.size-btn.large { width: 42px; height: 42px; }
.size-dot { background: white; border-radius: 50%; pointer-events: none; }
.size-btn.small .size-dot { width: 8px; height: 8px; }
.size-btn.large .size-dot { width: 18px; height: 18px; }

#clear-btn {
  width: 42px; height: 42px; border-radius: 10px;
  background: #e94560; border: none; cursor: pointer;
  font-size: 20px; margin-top: 4px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

#canvas-area {
  flex: 1; position: relative;
  background: white;
  overflow: hidden;
}
#pokemon-img-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
#pokemon-img-layer img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  /* 컬러 이미지를 흑백 윤곽선 도안 스타일로 변환 */
  filter: grayscale(1) contrast(10) brightness(1.8) invert(0);
  opacity: 0.85;
  image-rendering: pixelated;
}
#draw-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none;
  cursor: crosshair;
}
#loading-msg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #aaa; pointer-events: none;
}

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: white;
  padding: 8px 20px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  white-space: nowrap;
}
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center; z-index: 200;
}
#modal-overlay.show { display: flex; }
#modal {
  background: #16213e; border: 2px solid #e94560;
  border-radius: 16px; padding: 28px 24px; text-align: center; color: white; max-width: 280px;
}
#modal p { font-size: 17px; margin-bottom: 22px; line-height: 1.5; }
#modal-buttons { display: flex; gap: 12px; justify-content: center; }
.modal-btn { padding: 11px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
#modal-cancel { background: #3a3a4a; color: white; }
#modal-confirm { background: #e94560; color: white; }
</style>
</head>
<body>

<div id="header">
  <h1>🎨 포켓몬 소리 색칠판</h1>
  <div id="sound-indicator">
    <div id="sound-dot"></div>
    <span>소리 켜짐</span>
  </div>
</div>

<div id="pokemon-bar">
  <button class="pokemon-btn active" data-id="25" data-name="피카츄"><span class="emoji">⚡</span>피카츄</button>
  <button class="pokemon-btn" data-id="4" data-name="파이리"><span class="emoji">🔥</span>파이리</button>
  <button class="pokemon-btn" data-id="7" data-name="꼬부기"><span class="emoji">💧</span>꼬부기</button>
  <button class="pokemon-btn" data-id="1" data-name="이상해씨"><span class="emoji">🌿</span>이상해씨</button>
  <button class="pokemon-btn" data-id="133" data-name="이브이"><span class="emoji">🤎</span>이브이</button>
  <button class="pokemon-btn" data-id="39" data-name="푸린"><span class="emoji">🩷</span>푸린</button>
  <button class="pokemon-btn" data-id="54" data-name="고라파덕"><span class="emoji">💛</span>고라파덕</button>
  <button class="pokemon-btn" data-id="143" data-name="잠만보"><span class="emoji">🐻</span>잠만보</button>
  <button class="pokemon-btn" data-id="94" data-name="겐가"><span class="emoji">👻</span>겐가</button>
  <button class="pokemon-btn" data-id="150" data-name="뮤츠"><span class="emoji">💜</span>뮤츠</button>
</div>

<div id="main">
  <div id="palette">
    <button class="color-btn active" data-color="#FF3B30" style="background:#FF3B30"></button>
    <button class="color-btn" data-color="#FF9500" style="background:#FF9500"></button>
    <button class="color-btn" data-color="#FFD700" style="background:#FFD700"></button>
    <button class="color-btn" data-color="#34C759" style="background:#34C759"></button>
    <button class="color-btn" data-color="#007AFF" style="background:#007AFF"></button>
    <button class="color-btn" data-color="#AF52DE" style="background:#AF52DE"></button>
    <button class="color-btn" data-color="#FF69B4" style="background:#FF69B4"></button>
    <button class="color-btn" data-color="#8B4513" style="background:#8B4513"></button>
    <button class="color-btn" data-color="#1C1C1E" style="background:#1C1C1E"></button>
    <button class="color-btn eraser-btn" data-color="eraser" style="background:white">✕</button>
    <div id="brush-size-group">
      <button class="size-btn small active" data-size="10"><div class="size-dot"></div></button>
      <button class="size-btn large" data-size="26"><div class="size-dot"></div></button>
    </div>
    <button id="clear-btn">🗑</button>
  </div>

  <div id="canvas-area">
    <div id="pokemon-img-layer">
      <img id="pokemon-img" src="" alt="포켓몬" crossorigin="anonymous"/>
    </div>
    <div id="loading-msg">불러오는 중...</div>
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<div id="toast"></div>
<div id="modal-overlay">
  <div id="modal">
    <p>그림을 모두 지울까요?</p>
    <div id="modal-buttons">
      <button class="modal-btn" id="modal-cancel">취소</button>
      <button class="modal-btn" id="modal-confirm">지우기</button>
    </div>
  </div>
</div>

<script>
// ── Pokemon image loader (official artwork via PokeAPI sprites) ───────────────
const pokemonImg = document.getElementById('pokemon-img');
const loadingMsg = document.getElementById('loading-msg');

function loadPokemon(id, name) {
  loadingMsg.style.display = 'flex';
  pokemonImg.style.display = 'none';
  const url = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
  pokemonImg.onload = () => {
    loadingMsg.style.display = 'none';
    pokemonImg.style.display = 'block';
    const w = canvas.width / dpr, h = canvas.height / dpr;
    c.clearRect(0, 0, w, h);
    showToast(name + '를 골랐어요! 색칠해 보세요 🎨');
  };
  pokemonImg.onerror = () => {
    loadingMsg.textContent = '이미지를 불러오지 못했어요 😢';
  };
  pokemonImg.src = url;
}

document.querySelectorAll('.pokemon-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pokemon-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadPokemon(btn.dataset.id, btn.dataset.name);
  });
});

// ── State ─────────────────────────────────────────────────────────────────────
let currentColor = '#FF3B30';
let brushSize = 10;
let isDrawing = false;
let lastPoint = null;
let audioCtx = null;
let activeOsc = null, activeGain = null;

// ── Audio ─────────────────────────────────────────────────────────────────────
const INSTRUMENTS = {
  '#FF3B30': { type: 'drum' },
  '#FF9500': { type: 'maracas' },
  '#FFD700': { type: 'xylophone' },
  '#34C759': { type: 'piano-high' },
  '#007AFF': { type: 'piano-low' },
  '#AF52DE': { type: 'violin' },
  '#FF69B4': { type: 'xylophone' },
  '#8B4513': { type: 'bass' },
  '#1C1C1E': { type: 'bass' },
  'eraser':  { type: 'none' }
};
const SUSTAIN = new Set(['piano-high','piano-low','violin','bass']);

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function stopSound() {
  if (activeGain) {
    try {
      activeGain.gain.cancelScheduledValues(audioCtx.currentTime);
      activeGain.gain.setValueAtTime(activeGain.gain.value, audioCtx.currentTime);
      activeGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
    } catch(e) {}
  }
  if (activeOsc) {
    try { activeOsc.stop(audioCtx.currentTime + 0.22); } catch(e) {}
  }
  activeOsc = null; activeGain = null;
}

function playDrum() {
  const ac = ctx();
  const len = ac.sampleRate * 0.15;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.value = 0.5;
  src.connect(g).connect(ac.destination); src.start();
  const o = ac.createOscillator(), g2 = ac.createGain();
  o.frequency.setValueAtTime(110, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.18);
  g2.gain.setValueAtTime(0.9, ac.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
  o.connect(g2).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.22);
}

function playMaracas() {
  const ac = ctx();
  const len = ac.sampleRate * 0.1;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.5);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 4000; f.Q.value = 0.5;
  const g = ac.createGain(); g.gain.value = 0.7;
  src.connect(f).connect(g).connect(ac.destination); src.start();
}

function playXylophone() {
  const ac = ctx();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = 1047;
  g.gain.setValueAtTime(0.7, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.45);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.45);
}

function startSustain(freq, waveType, detune = 0) {
  stopSound();
  const ac = ctx();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = waveType; o.frequency.value = freq;
  if (detune) o.detune.value = detune;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(0.45, ac.currentTime + 0.06);
  o.connect(g).connect(ac.destination); o.start();
  activeOsc = o; activeGain = g;
}

function playSound(color, isStart) {
  if (color === 'eraser') return;
  const inst = INSTRUMENTS[color];
  if (!inst || inst.type === 'none') return;
  if (SUSTAIN.has(inst.type)) {
    if (isStart) {
      if (inst.type === 'piano-high') startSustain(523, 'sine');
      else if (inst.type === 'piano-low') startSustain(262, 'sine');
      else if (inst.type === 'violin') startSustain(440, 'sawtooth', 8);
      else if (inst.type === 'bass') startSustain(110, 'triangle');
    } else stopSound();
  } else {
    if (!isStart) return;
    if (inst.type === 'drum') playDrum();
    else if (inst.type === 'maracas') playMaracas();
    else if (inst.type === 'xylophone') playXylophone();
  }
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('draw-canvas');
const c = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

function resize() {
  const area = document.getElementById('canvas-area');
  const r = area.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  c.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

function drawLine(pos) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.lineWidth = brushSize;
  if (currentColor === 'eraser') {
    c.globalCompositeOperation = 'destination-out';
    c.strokeStyle = 'rgba(0,0,0,1)';
    c.fillStyle = 'rgba(0,0,0,1)';
  } else {
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = currentColor;
    c.fillStyle = currentColor;
  }
  if (lastPoint) {
    c.beginPath(); c.moveTo(lastPoint.x, lastPoint.y); c.lineTo(pos.x, pos.y); c.stroke();
  } else {
    c.beginPath(); c.arc(pos.x, pos.y, brushSize/2, 0, Math.PI*2); c.fill();
  }
  lastPoint = pos;
}

function onStart(e) {
  e.preventDefault();
  isDrawing = true; lastPoint = null;
  ctx();
  playSound(currentColor, true);
  drawLine(getPos(e));
}
function onMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  drawLine(getPos(e));
}
function onEnd() {
  isDrawing = false; lastPoint = null;
  playSound(currentColor, false);
}

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onEnd);
canvas.addEventListener('mouseleave', onEnd);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd);
canvas.addEventListener('touchcancel', onEnd);

// ── Color palette ─────────────────────────────────────────────────────────────
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
  });
});

// ── Brush size ────────────────────────────────────────────────────────────────
document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushSize = parseInt(btn.dataset.size);
  });
});

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.add('show');
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
});
document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  c.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  showToast('그림을 깨끗하게 지웠어요!');
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = '0', 2200);
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadPokemon('25', '피카츄');
</script>
</body>
</html>
