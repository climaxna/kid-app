<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎨 포켓몬 색칠판</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-bottom: 3px solid #e94560;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#header h1 { color: #FFD700; font-size: 18px; font-weight: 900; }

#pokemon-bar {
  background: #16213e;
  display: flex; gap: 6px;
  padding: 8px 10px;
  overflow-x: auto;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}
#pokemon-bar::-webkit-scrollbar { display: none; }
.pokemon-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; padding: 6px 12px;
  border-radius: 10px; border: 2px solid transparent;
  color: #888; font-size: 11px; font-weight: 700;
  background: #0f3460; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.pokemon-btn.active { border-color: #FFD700; color: #FFD700; background: #1a3a5c; }
.pokemon-btn .emoji { font-size: 24px; line-height: 1; }

#main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

#palette {
  background: #16213e;
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; padding: 8px 7px;
  border-right: 2px solid #0f3460;
  flex-shrink: 0; overflow-y: auto;
}
#palette::-webkit-scrollbar { display: none; }
.color-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s;
}
.color-btn.active { border-color: #fff; transform: scale(1.18); }
.eraser-btn { border-color: #555 !important; font-size: 18px; color: #aaa;
  display: flex; align-items: center; justify-content: center; }
.eraser-btn.active { border-color: #FFD700 !important; }
#clear-btn {
  width: 44px; height: 44px; border-radius: 10px;
  background: #e94560; border: none; cursor: pointer;
  font-size: 20px; margin-top: 4px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

#canvas-area {
  flex: 1; position: relative; background: white; overflow: hidden;
}
#draw-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none;
  cursor: crosshair;
}
#loading-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: white; font-size: 18px; color: #888; z-index: 10;
}
#loading-overlay.hidden { display: none; }

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.82); color: white;
  padding: 9px 22px; border-radius: 22px; font-size: 14px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  white-space: nowrap;
}
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center; z-index: 200;
}
#modal-overlay.show { display: flex; }
#modal {
  background: #16213e; border: 2px solid #e94560;
  border-radius: 16px; padding: 28px 24px; text-align: center; color: white; max-width: 280px;
}
#modal p { font-size: 17px; margin-bottom: 22px; line-height: 1.5; }
#modal-buttons { display: flex; gap: 12px; justify-content: center; }
.modal-btn { padding: 11px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
#modal-cancel { background: #3a3a4a; color: white; }
#modal-confirm { background: #e94560; color: white; }
</style>
</head>
<body>

<div id="header">
  <h1>🎨 포켓몬 색칠판</h1>
</div>

<div id="pokemon-bar">
  <button class="pokemon-btn active" data-id="25" data-name="피카츄"><span class="emoji">⚡</span>피카츄</button>
  <button class="pokemon-btn" data-id="4" data-name="파이리"><span class="emoji">🔥</span>파이리</button>
  <button class="pokemon-btn" data-id="7" data-name="꼬부기"><span class="emoji">💧</span>꼬부기</button>
  <button class="pokemon-btn" data-id="1" data-name="이상해씨"><span class="emoji">🌿</span>이상해씨</button>
  <button class="pokemon-btn" data-id="133" data-name="이브이"><span class="emoji">🤎</span>이브이</button>
  <button class="pokemon-btn" data-id="39" data-name="푸린"><span class="emoji">🩷</span>푸린</button>
  <button class="pokemon-btn" data-id="54" data-name="고라파덕"><span class="emoji">💛</span>고라파덕</button>
  <button class="pokemon-btn" data-id="143" data-name="잠만보"><span class="emoji">🐻</span>잠만보</button>
  <button class="pokemon-btn" data-id="94" data-name="겐가"><span class="emoji">👻</span>겐가</button>
  <button class="pokemon-btn" data-id="150" data-name="뮤츠"><span class="emoji">💜</span>뮤츠</button>
</div>

<div id="main">
  <div id="palette">
    <button class="color-btn active" data-color="#FF3B30" style="background:#FF3B30"></button>
    <button class="color-btn" data-color="#FF9500" style="background:#FF9500"></button>
    <button class="color-btn" data-color="#FFD700" style="background:#FFD700"></button>
    <button class="color-btn" data-color="#34C759" style="background:#34C759"></button>
    <button class="color-btn" data-color="#007AFF" style="background:#007AFF"></button>
    <button class="color-btn" data-color="#AF52DE" style="background:#AF52DE"></button>
    <button class="color-btn" data-color="#FF69B4" style="background:#FF69B4"></button>
    <button class="color-btn" data-color="#8B4513" style="background:#8B4513"></button>
    <button class="color-btn" data-color="#1C1C1E" style="background:#1C1C1E"></button>
    <button class="color-btn eraser-btn" data-color="eraser" style="background:white">✕</button>
    <button id="clear-btn">🗑</button>
  </div>

  <div id="canvas-area">
    <div id="loading-overlay">불러오는 중... 🎨</div>
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<div id="toast"></div>
<div id="modal-overlay">
  <div id="modal">
    <p>그림을 모두 지울까요?</p>
    <div id="modal-buttons">
      <button class="modal-btn" id="modal-cancel">취소</button>
      <button class="modal-btn" id="modal-confirm">지우기</button>
    </div>
  </div>
</div>

<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap at 2 for performance

// Boundary canvas: same physical size as main canvas
// White = fillable, Black = outline boundary
const bCanvas = document.createElement('canvas');
const bCtx = bCanvas.getContext('2d', { willReadFrequently: true });

// Outline display canvas: drawn on top for visual
const oCanvas = document.createElement('canvas');
const oCtx = oCanvas.getContext('2d');

let currentColor = '#FF3B30';
let currentImg = null;
let audioCtx = null;

// ── Resize ────────────────────────────────────────────────────────────────────
function cssSize() {
  const r = document.getElementById('canvas-area').getBoundingClientRect();
  return { w: Math.round(r.width), h: Math.round(r.height) };
}

function resize() {
  const { w, h } = cssSize();
  const pw = w * dpr, ph = h * dpr;

  canvas.width = pw; canvas.height = ph;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  bCanvas.width = pw; bCanvas.height = ph;
  oCanvas.width = pw; oCanvas.height = ph;

  if (currentImg) buildAndDraw(currentImg);
}
window.addEventListener('resize', () => { resize(); });

// ── Build outline from image ──────────────────────────────────────────────────
function imgFitRect(img) {
  const { w, h } = cssSize();
  const pad = 28 * dpr;
  const pw = w * dpr, ph = h * dpr;
  const scale = Math.min((pw - pad*2) / img.width, (ph - pad*2) / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  const dx = (pw - dw) / 2, dy = (ph - dh) / 2;
  return { dx, dy, dw, dh };
}

function buildAndDraw(img) {
  const pw = bCanvas.width, ph = bCanvas.height;
  const { dx, dy, dw, dh } = imgFitRect(img);

  // ── Step 1: draw original image on temp canvas ────────────────────────────
  const tmp = document.createElement('canvas');
  tmp.width = pw; tmp.height = ph;
  const tc = tmp.getContext('2d');
  tc.clearRect(0, 0, pw, ph);
  tc.drawImage(img, dx, dy, dw, dh);
  const src = tc.getImageData(0, 0, pw, ph).data;

  // ── Step 2: grayscale (alpha-premultiplied onto white bg) ─────────────────
  const gray = new Float32Array(pw * ph);
  for (let i = 0; i < pw * ph; i++) {
    const a = src[i*4+3] / 255;
    // Composite onto white
    const r = src[i*4]   * a + 255 * (1-a);
    const g = src[i*4+1] * a + 255 * (1-a);
    const b = src[i*4+2] * a + 255 * (1-a);
    gray[i] = 0.299*r + 0.587*g + 0.114*b;
  }

  // ── Step 3: Sobel edge detection ──────────────────────────────────────────
  const edge = new Float32Array(pw * ph);
  for (let y = 1; y < ph-1; y++) {
    for (let x = 1; x < pw-1; x++) {
      const tl=gray[(y-1)*pw+(x-1)], tc2=gray[(y-1)*pw+x], tr=gray[(y-1)*pw+(x+1)];
      const ml=gray[y*pw+(x-1)],                             mr=gray[y*pw+(x+1)];
      const bl=gray[(y+1)*pw+(x-1)], bc2=gray[(y+1)*pw+x], br=gray[(y+1)*pw+(x+1)];
      const gx = -tl - 2*ml - bl + tr + 2*mr + br;
      const gy = -tl - 2*tc2 - tr + bl + 2*bc2 + br;
      edge[y*pw+x] = Math.sqrt(gx*gx + gy*gy);
    }
  }

  // ── Step 4: Threshold + dilate for thick visible outline ─────────────────
  const THRESHOLD = 35;
  const DILATE = Math.round(1.5 * dpr); // thicker line on high-dpr
  const isBoundary = new Uint8Array(pw * ph);
  for (let i = 0; i < pw * ph; i++) {
    if (edge[i] > THRESHOLD) isBoundary[i] = 1;
  }
  const dilated = new Uint8Array(pw * ph);
  for (let y = 0; y < ph; y++) {
    for (let x = 0; x < pw; x++) {
      if (!isBoundary[y*pw+x]) continue;
      for (let dy2 = -DILATE; dy2 <= DILATE; dy2++) {
        for (let dx2 = -DILATE; dx2 <= DILATE; dx2++) {
          const ny = y+dy2, nx = x+dx2;
          if (ny>=0 && ny<ph && nx>=0 && nx<pw) dilated[ny*pw+nx] = 1;
        }
      }
    }
  }

  // ── Step 5: Also mark outside-image pixels as boundary ───────────────────
  for (let i = 0; i < pw * ph; i++) {
    if (src[i*4+3] < 30) dilated[i] = 1; // transparent = outside
  }

  // ── Step 6: Write boundary canvas (black=boundary, white=fillable) ───────
  const bData = bCtx.createImageData(pw, ph);
  for (let i = 0; i < pw * ph; i++) {
    const v = dilated[i] ? 0 : 255;
    bData.data[i*4] = v; bData.data[i*4+1] = v;
    bData.data[i*4+2] = v; bData.data[i*4+3] = 255;
  }
  bCtx.putImageData(bData, 0, 0);

  // ── Step 7: Write outline display canvas (black lines only, rest transparent)
  const oData = oCtx.createImageData(pw, ph);
  for (let i = 0; i < pw * ph; i++) {
    if (dilated[i]) {
      oData.data[i*4] = 0; oData.data[i*4+1] = 0;
      oData.data[i*4+2] = 0; oData.data[i*4+3] = 255;
    } else {
      oData.data[i*4+3] = 0; // transparent
    }
  }
  oCtx.putImageData(oData, 0, 0);

  // ── Step 8: Draw to main canvas: white bg + outline on top ───────────────
  ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width/dpr, canvas.height/dpr);
  drawOutlineOnTop();
}

function drawOutlineOnTop() {
  const { w, h } = cssSize();
  ctx.drawImage(oCanvas, 0, 0, w, h);
}

// ── Flood Fill ────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function floodFill(cssX, cssY, fillHex) {
  const px = Math.round(cssX * dpr);
  const py = Math.round(cssY * dpr);
  const W = bCanvas.width, H = bCanvas.height;

  if (px < 0 || py < 0 || px >= W || py >= H) return;

  // Check boundary
  const bPx = bCtx.getImageData(px, py, 1, 1).data;
  if (bPx[0] < 128) return; // on boundary, skip

  // Read color canvas (physical pixels)
  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;
  const bAll = bCtx.getImageData(0, 0, W, H).data;

  const ti = (py * W + px) * 4;
  const tR = data[ti], tG = data[ti+1], tB = data[ti+2], tA = data[ti+3];

  const [fR, fG, fB] = hexToRgb(fillHex);
  if (tR===fR && tG===fG && tB===fB && tA===255) return;

  const stack = [py * W + px];
  const visited = new Uint8Array(W * H);
  visited[py * W + px] = 1;

  while (stack.length) {
    const pos = stack.pop();
    const x = pos % W, y = (pos / W) | 0;
    const i = pos * 4;
    data[i] = fR; data[i+1] = fG; data[i+2] = fB; data[i+3] = 255;

    const ns = [];
    if (x > 0)   ns.push(pos - 1);
    if (x < W-1) ns.push(pos + 1);
    if (y > 0)   ns.push(pos - W);
    if (y < H-1) ns.push(pos + W);

    for (const n of ns) {
      if (visited[n]) continue;
      if (bAll[n*4] < 128) continue; // boundary
      const ni = n * 4;
      if (data[ni]!==tR || data[ni+1]!==tG || data[ni+2]!==tB || data[ni+3]!==tA) continue;
      visited[n] = 1;
      stack.push(n);
    }
  }

  ctx.putImageData(imgData, 0, 0);
  // Re-draw outline on top
  drawOutlineOnTop();
}

// ── Eraser ────────────────────────────────────────────────────────────────────
function erase(cssX, cssY) {
  const r = 22;
  ctx.save();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cssX, cssY, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  drawOutlineOnTop();
}

// ── Pointer events (works for both mouse & touch) ────────────────────────────
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!currentImg) return;

  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  if (currentColor === 'eraser') {
    erase(x, y);
  } else {
    floodFill(x, y, currentColor);
    playSound(currentColor);
  }
}, { passive: false });

// ── Pokemon loader ─────────────────────────────────────────────────────────────
function loadPokemon(id, name) {
  document.getElementById('loading-overlay').classList.remove('hidden');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    currentImg = img;
    buildAndDraw(img);
    document.getElementById('loading-overlay').classList.add('hidden');
    showToast(name + ' 색칠해 보세요! 🎨');
  };
  img.onerror = () => {
    document.getElementById('loading-overlay').textContent = '이미지 오류 😢';
  };
  img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
}

// ── Color buttons ─────────────────────────────────────────────────────────────
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
  });
});

// ── Pokemon buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.pokemon-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pokemon-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadPokemon(btn.dataset.id, btn.dataset.name);
  });
});

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.add('show');
});
document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
});
document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  if (currentImg) buildAndDraw(currentImg);
  showToast('다시 색칠해봐요! 🎨');
});

// ── Audio ─────────────────────────────────────────────────────────────────────
const SOUNDS = {
  '#FF3B30':'drum','#FF9500':'maracas','#FFD700':'xylo',
  '#34C759':'piano-hi','#007AFF':'piano-lo','#AF52DE':'violin',
  '#FF69B4':'xylo','#8B4513':'bass','#1C1C1E':'bass'
};

function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(color) {
  const type = SOUNDS[color]; if (!type) return;
  const ac = getAC();
  if (type==='drum') {
    const len=ac.sampleRate*0.15, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=ac.createBufferSource(); s.buffer=buf;
    const g=ac.createGain(); g.gain.value=0.5;
    s.connect(g).connect(ac.destination); s.start();
    const o=ac.createOscillator(),g2=ac.createGain();
    o.frequency.setValueAtTime(100,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+0.2);
    g2.gain.setValueAtTime(0.8,ac.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.22);
    o.connect(g2).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.22);
  } else if (type==='maracas') {
    const len=ac.sampleRate*0.1, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
    const s=ac.createBufferSource(); s.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=4000; f.Q.value=0.5;
    const g=ac.createGain(); g.gain.value=0.7;
    s.connect(f).connect(g).connect(ac.destination); s.start();
  } else if (type==='xylo') {
    const notes=[523,659,784,1047];
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle'; o.frequency.value=notes[Math.floor(Math.random()*notes.length)];
    g.gain.setValueAtTime(0.6,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.5);
  } else if (type==='piano-hi'||type==='piano-lo') {
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value=type==='piano-hi'?523:262;
    g.gain.setValueAtTime(0.5,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.9);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.9);
  } else if (type==='violin') {
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth'; o.frequency.value=440; o.detune.value=8;
    g.gain.setValueAtTime(0.3,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.6);
  } else if (type==='bass') {
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle'; o.frequency.value=110;
    g.gain.setValueAtTime(0.5,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.5);
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.opacity='0',2200);
}

// ── Init ──────────────────────────────────────────────────────────────────────
resize();
loadPokemon('25','피카츄');
</script>
</body>
</html>
