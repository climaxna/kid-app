<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 말씀 영상 5편</title><style>body{margin:0;padding:24px;background:#171717;color:#eee;font:18px system-ui}h1{font-size:24px}main{display:flex;gap:20px;flex-wrap:wrap}article{width:300px}video{width:100%;max-height:70vh;background:#000}a{color:#f6d7a5}p{font-size:16px}</style><h1>오늘의 말씀 영상 5편</h1><p>새 성화 배경에 풍경 움직임을 합성했습니다. 각 영상 30~40초, B 목소리와 피아노 음악.</p><main id="cards"></main><h2>배경 움직임 확인</h2><video style="width:300px" src="backgrounds/lake-motion.mp4" controls autoplay muted loop></video><script>const titles=['내일 걱정으로 오늘이 힘들 때','두려운 시간을 지나고 있는 당신에게','마음의 평안이 필요한 날 듣는 말씀','다시 시작할 힘이 필요한 아침','가족 걱정이 많은 날 함께 드리는 기도'];const files=['06-today','07-valley','08-peace','09-morning','10-family'];cards.innerHTML=files.map((file,i)=>`<article><h2 style="font-size:19px">${i+6}. ${titles[i]}</h2><video controls preload="metadata" src="${file}.mp4"></video><p><a href="${file}.mp4" download>영상 저장</a> · <a href="${file}-upload.txt">업로드 설명</a></p></article>`).join('');</script></html>
