<style>body{background:#17171b;color:#eee;font:16px sans-serif;max-width:1100px;margin:30px auto}video{width:100%;max-height:60vh;background:#000}button{display:block;width:100%;padding:16px;text-align:left;margin:12px 0;background:#29292f;color:white;border:1px solid #555;border-radius:10px;cursor:pointer}button:hover{border-color:#ffe34b}p{line-height:1.6}#clock{color:#ffe34b}</style>
<h1>클립 후보 검토</h1><p>버튼을 누르면 해당 구간을 재생하고 끝에서 멈춥니다. 대사는 자동 인식 초안입니다.</p>
<video id="video" controls preload="metadata" src="file:///C:/blog/shorts/local_clipper/jobs/61c7d343f8bd7d/source.mp4"></video><p id="clock"></p><button data-start="3.73" data-end="26.99"><b>후보 1 · 00:03.73–00:26.99</b><p>아 근데 이게 말이 돼요? 아 왜 우리 팀이 자첸데서 타고 전화 합쳐지는 거예요? 재정이 어렵대잖아 재정이. 지금 내매 사귀로 사운드 하려고 했는데. 회사까지. 오 쟤네. Are you okay? What problem? 야 아무튼 소리가 진짜 빠졌네. 그냥 반짝은 영어 쓰지 말고 이렇게 된 마당에 그냥. 욕심 차려라요.</p></button><button data-start="33.94" data-end="56.74"><b>후보 2 · 00:33.94–00:56.74</b><p>근데 소문에 저 디자인 팀 사운드를 한 명씩 사라진다는 얘기가 있어. 갑자기 병가를 낸다거나 하면서요. 에이, 그거 다 소문이에요. 희망 퇴직 한 거겠죠? 들어가시죠. 그래. 아, 조심하세요. 뭐야, 뭐야. 여기 사무실로 하죠?</p></button><button data-start="49.08" data-end="72.32"><b>후보 3 · 00:49.08–01:12.32</b><p>뭐야, 뭐야. 여기 사무실로 하죠? 하신 분들이구나. 안녕하세요. 전종사예요.</p></button><button data-start="79.04" data-end="109.53"><b>후보 4 · 01:19.04–01:49.53</b><p>사람들이 새로 왔어. 대체 왜 그러는 거예요? 와 사무신 너무 레트로한데? 스나이프! 여긴 지하의 등이라 로비라 너무 가깝잖아? 완전 럭키 앤이잖아? 장원영은 건드지 마라. 죽인다. 얘도 자천된 건가?</p></button><button data-start="116.71" data-end="140.09"><b>후보 5 · 01:56.71–02:20.09</b><p>저기 종사님. 그 기회관으로 쓸 만한 자료 좀 정리해 주시겠습니까? 네 알겠습니다. 근데... 눈 마주치면 돌로 변할 것 같아, 엄마. 뭐, 뭐 할 말 있니?</p></button><button data-start="137.74" data-end="168.04"><b>후보 6 · 02:17.74–02:48.04</b><p>뭐, 뭐 할 말 있니? 잘 가봤습니다. 다른 것도 커! 저렇게 둘이 싸우고 누가 이길까요?</p></button>
<script>const v=document.querySelector('video');let stop=null;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.start);stop=Number(b.dataset.end);v.play()});v.ontimeupdate=()=>{document.querySelector('#clock').textContent='원본 '+v.currentTime.toFixed(2)+'초';if(stop!==null&&v.currentTime>=stop){v.pause();stop=null}};</script>
